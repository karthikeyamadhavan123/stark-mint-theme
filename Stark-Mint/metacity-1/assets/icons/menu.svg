<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="housing" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#414141"/>
      <stop offset="0.45" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="24" y1="7" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FFFFF"/>
      <stop offset="0.45" stop-color="#55DEE0"/>
      <stop offset="1" stop-color="#1A98A5"/>
    </linearGradient>

    <linearGradient id="wellGrad" x1="24" y1="15" x2="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F1F1F"/>
      <stop offset="1" stop-color="#0C0C0C"/>
    </linearGradient>

    <linearGradient id="sectionGrad" x1="24" y1="17" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FFFFF"/>
      <stop offset="0.35" stop-color="#55DEE0"/>
      <stop offset="1" stop-color="#1A98A5"/>
    </linearGradient>

    <radialGradient id="coreGrad" cx="24" cy="25.2" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#C9FFFF"/>
      <stop offset="0.58" stop-color="#8FFFFF"/>
      <stop offset="0.84" stop-color="#55DEE0"/>
      <stop offset="1" stop-color="#1A98A5"/>
    </radialGradient>
  </defs>

  <!-- 1. Outer charcoal circular housing (unchanged) -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#housing)" stroke-width="4"/>
  <!-- Outer glow adjustment: white arc highlight 0.10 -> 0.075 (-25%) -->
  <path d="M6.60 15.89A19.2 19.2 0 0 1 41.40 15.89"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.075"
        stroke-width="1.2" stroke-linecap="round"/>

  <!-- 2. Inner cyan illuminated ring (unchanged) -->
  <!-- Outer glow adjustment: halo ring 0.45 -> 0.34 (-24%) -->
  <circle cx="24" cy="24" r="17.1" fill="none" stroke="#1A98A5" stroke-width="1.8" opacity="0.34"/>
  <circle cx="24" cy="24" r="17.1" fill="none" stroke="url(#ringGrad)" stroke-width="1.25"/>

  <!-- 3. Recessed dark inverted triangular structure (unchanged) -->
  <path d="M10.49 16.20 L37.51 16.20 L24 39.60 Z" fill="url(#wellGrad)"/>

  <!-- 4. Three raised cyan energy sections (unchanged) -->
  <path d="M12.22 17.20 L35.78 17.20 L31.97 19.40 L16.03 19.40 Z" fill="url(#sectionGrad)"/>
  <path d="M12.22 17.20 L24 37.60 L24 33.20 L16.03 19.40 Z" fill="url(#sectionGrad)"/>
  <path d="M35.78 17.20 L24 37.60 L24 33.20 L31.97 19.40 Z" fill="url(#sectionGrad)"/>

  <!-- Geometric charcoal separators (unchanged) -->
  <path d="M16.03 19.40 L12.22 17.20 M31.97 19.40 L35.78 17.20 M24 33.20 L24 37.60"
        stroke="#252525" stroke-width="1.9" stroke-linecap="butt"/>

  <!-- Subtle top-plate highlight (unchanged) -->
  <path d="M13.5 17.75 H34.5" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="0.7"/>

  <!-- 5. Central glowing triangular energy core (unchanged) -->
  <path d="M16.03 19.40 L31.97 19.40 L24 33.20 Z" fill="#252525"/>
  <path d="M17.59 20.30 L30.41 20.30 L24 31.40 Z" fill="url(#coreGrad)"/>
  <path d="M24 27.60 L21.00 23.00 L27.00 23.00 Z" fill="#FFFFFF" opacity="0.30"/>
</svg>